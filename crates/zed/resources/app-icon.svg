<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Vireo: VS Code's window plan, a file tree and an editor, with a bird in the editor.</title>
  <!-- Workshop amber tile, ink glyph: the TheSTouch icon family (see The Farm hub icon).
       macOS grid: the tile is 824 px with a 100 px margin and a soft shadow, like the system's
       icons. windows/app-icon.svg is the same design full bleed. Regenerate the PNG and ICO
       files with script/generate-app-icons. -->
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024"><stop offset="0" stop-color="#FFC926"/><stop offset="1" stop-color="#F2B300"/></linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/><stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.32"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(0.8046875)">
    <rect width="1024" height="1024" rx="230" ry="230" fill="url(#body)" filter="url(#shadow)"/>
    <rect width="1024" height="1024" rx="230" ry="230" fill="url(#sheen)"/>
    <rect x="204" y="244" width="616" height="536" rx="84" ry="84" fill="#121210"/>
    <rect x="420" y="300" width="344" height="424" rx="28" ry="28" fill="url(#body)"/>
    <g fill="url(#body)">
      <rect x="264" y="352" width="104" height="24" rx="12"/>
      <rect x="288" y="412" width="80" height="24" rx="12"/>
      <rect x="288" y="472" width="80" height="24" rx="12"/>
    </g>
    <path d="M512 494 C546 460 574 472 592 548 C610 472 638 460 672 494" fill="none" stroke="#121210" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
